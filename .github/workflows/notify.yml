name: Daily notifications
on:
  workflow_dispatch:           # manual only: each run sends ONE push (GitHub button or the phone shortcut)
    inputs:
      slot:  { description: "Type to send (scholarship | news | jobs | tech | closing) – leave empty to rotate", required: false, default: "" }
      topic: { description: "One audience only (all | r_africa | …) – leave empty for everyone", required: false, default: "" }
concurrency: { group: notify, cancel-in-progress: false }
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r crawler/requirements.txt
      - name: Send one push
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SLOT: ${{ github.event.inputs.slot }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: python crawler/notify.py
