name: Daily notifications
on:
  schedule:
    - cron: "30 * * * *"       # every hour at :30 – notify.py works out which audience is at 07/10/13/16/19 local time
  workflow_dispatch:
    inputs:
      slot:  { description: "Force a slot (morning | news | tech | closing | evening) – leave empty for normal", required: false, default: "" }
      topic: { description: "Force one topic (all | r_africa | …) – leave empty for all", required: false, default: "" }
concurrency: { group: notify, cancel-in-progress: false }
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r crawler/requirements.txt
      - name: Send the slot that is due
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SLOT: ${{ github.event.inputs.slot }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: python crawler/notify.py
