name: Send push
on:
  workflow_dispatch:
    inputs:
      item:  { description: "Open this card on tap: scholarship id, or jobs:<id> / school_news:<id> / tech_news:<id> (optional – fills title/text/picture if left empty below)", required: false, default: "" }
      title: { description: "Title (required if no item)", required: false, default: "" }
      body:  { description: "Text (one or two short sentences)", required: false, default: "" }
      image: { description: "Picture link (https://…) – optional", required: false, default: "" }
      topic: { description: "Who: all | r_africa | r_europe | r_north_america | r_asia | r_middle_east | r_oceania | r_latin_america", required: false, default: "all" }
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r crawler/requirements.txt
      - name: Send
        working-directory: crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ITEM: ${{ github.event.inputs.item }}
          TITLE: ${{ github.event.inputs.title }}
          BODY: ${{ github.event.inputs.body }}
          IMAGE: ${{ github.event.inputs.image }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: python send_push.py
