name: Make signing key (run once)
on:
  workflow_dispatch:
    inputs:
      password:
        description: "Keystore password (choose a strong one and SAVE it – you can never recover it)"
        required: true
      name:
        description: "Your full name (goes inside the certificate)"
        required: true
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Generate keystore
        run: |
          keytool -genkeypair -v -keystore scholarhub-release.keystore -alias scholarhub \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.password }}" -keypass "${{ github.event.inputs.password }}" \
            -dname "CN=${{ github.event.inputs.name }}, OU=ScholarHub, O=ScholarHub, L=Lagos, ST=Lagos, C=NG"
          base64 -w0 scholarhub-release.keystore > KEYSTORE_BASE64.txt
          keytool -list -v -keystore scholarhub-release.keystore -alias scholarhub -storepass "${{ github.event.inputs.password }}" | grep -E "SHA1|SHA256" > fingerprints.txt
          cat > README.txt <<'EOF'
          YOUR APP SIGNING KEY – KEEP THIS FOLDER FOREVER (Google Drive + email to yourself).
          If you lose it you can never update ScholarHub on Google Play.

          Add these 4 secrets in GitHub (Settings -> Secrets -> Actions):
            KEYSTORE_BASE64   = the whole content of KEYSTORE_BASE64.txt
            KEYSTORE_PASSWORD = the password you typed when running this workflow
            KEY_ALIAS         = scholarhub
            KEY_PASSWORD      = same password
          Then DELETE this workflow run (Actions -> the run -> ... -> Delete workflow run)
          and delete .github/workflows/make-keystore.yml so nobody can re-run it.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: SIGNING-KEY-KEEP-SAFE
          path: |
            scholarhub-release.keystore
            KEYSTORE_BASE64.txt
            fingerprints.txt
            README.txt
          retention-days: 3
