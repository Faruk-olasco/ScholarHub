name: Build Android APK
on:
  push:
    branches: [main]
    paths: ["mobile/**"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: npm install
      - run: npx cap add android
      - run: ADMOB_APP_ID="${{ secrets.ADMOB_APP_ID }}" ./setup-android.sh
      - run: npx cap sync android
      - name: Build debug APK (installable for testing)
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Build signed release AAB (for Google Play) if keystore secret exists
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          echo
